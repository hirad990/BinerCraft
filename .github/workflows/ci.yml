name: BinerCraft CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BCN/binercraft/binercraft-backend/package-lock.json

      - name: Backend install
        working-directory: BCN/binercraft/binercraft-backend
        run: npm ci

      - name: Backend syntax check
        working-directory: BCN/binercraft/binercraft-backend
        run: node --check server.js

      - name: Frontend install
        working-directory: BCN/binercraft/binercraft-frontend
        run: npm install

      - name: Frontend build
        working-directory: BCN/binercraft/binercraft-frontend
        run: npm run build
